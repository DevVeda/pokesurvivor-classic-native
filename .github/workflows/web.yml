# La web en GitHub Pages (https://devveda.github.io/pokesurvivor-classic-native/) al subir main, o a mano (Actions →
# web → Run workflow). Es `just web`: js/env.js desde el .env del servidor, js/app.js y las huellas, y dist/web.
# El .env no está en git: va en el secreto WEB_ENV del repositorio (Settings → Secrets and variables → Actions),
# con su contenido tal cual. Sólo valores públicos (los mismos que acaban en js/env.js). Gratis en un repositorio público.
name: web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Servidor (.env del secreto WEB_ENV)
        env:
          WEB_ENV: ${{ secrets.WEB_ENV }}
        run: |
          test -n "$WEB_ENV" || { echo "Falta el secreto WEB_ENV (el contenido de tu .env)"; exit 1; }
          printf '%s\n' "$WEB_ENV" > .env
          node tools/apply-env.mjs
      - name: Construir la web
        run: node tools/build-web.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
      - id: deploy
        uses: actions/deploy-pages@v5
